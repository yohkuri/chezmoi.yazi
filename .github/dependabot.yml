# Monthly version updates, one grouped pull request per ecosystem. Security
# updates ignore the schedule, the groups and the cooldown.
#
# The cooldown holds back npm releases younger than a week. The workflow names
# actions by floating major tag, so for them it delays only a new major; minor
# and patch releases reach CI as soon as the tag moves.
#
# Short group names keep most commit headers within the 72 columns
# `.commitlintrc.yml` allows. A long package name updated alone can still go
# over: reword that commit and force-push it. Dependabot then stops updating
# the branch, and `@dependabot rebase` would restore the long header, so rebase
# it by hand when `main` moves.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
